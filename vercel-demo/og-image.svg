  <text x="120" y="484" fill="#6f8294" font-family="Arial, Helvetica, sans-serif" font-size="20">github.com/samwhine</text>
  <rect x="914" y="393" width="150" height="76" rx="10" fill="#101d29" stroke="#00d4ff" stroke-opacity=".45"/>
